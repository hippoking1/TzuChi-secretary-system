<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>活動建立與管理 — 慈濟活動報名系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <?!= include('css/Styles') ?>
  <?!= include('js/Api') ?>
</head>
<body>
  <?!= include('partials/Header') ?>

  <div class="admin-container" style="display: flex;">
    <?!= include('partials/AdminSidebar') ?>

    <main class="admin-main" style="flex: 1; padding: 32px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
        <h2 style="font-size: 24px;">📅 活動列表與管理</h2>
        <a href="javascript:void(0)" onclick="navTo('admin-event-form')" class="btn btn-primary">➕ 新建活動</a>
      </div>

      <div class="card">
        <div class="table-responsive">
          <table style="width: 100%; border-collapse: collapse; min-width: 600px;">
            <thead>
              <tr style="border-bottom: 2px solid var(--neutral-200); text-align: left;">
                <th style="padding: 12px 8px;">活動名稱</th>
                <th style="padding: 12px 8px;">分類</th>
                <th style="padding: 12px 8px;">活動日期</th>
                <th style="padding: 12px 8px;">報名人數</th>
                <th style="padding: 12px 8px;">狀態</th>
                <th style="padding: 12px 8px;">截止日期</th>
                <th style="padding: 12px 8px; text-align: right;">操作</th>
              </tr>
            </thead>
            <tbody id="events-table">
              <!-- 內建動態渲染 -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    const token = localStorage.getItem('tzuchi_admin_token');

    document.addEventListener('DOMContentLoaded', () => {
      if (!token) {
        navTo('login');
        return;
      }
      loadAdminEvents();
    });

    async function loadAdminEvents() {
      showLoading('載入活動列表中...');
      try {
        const events = await api('getAllEvents', token, '全部');
        hideLoading();
        renderAdminEvents(events);
      } catch (e) {
        hideLoading();
        showToast('載入失敗', 'error');
      }
    }

    function renderAdminEvents(events) {
      const tbody = document.getElementById('events-table');
      if (!events || events.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="padding: 24px; text-align: center; color: var(--neutral-500);">尚無活動紀錄</td></tr>';
        return;
      }

      tbody.innerHTML = events.map(e => `
        <tr style="border-bottom: 1px solid var(--neutral-200);">
          <td style="padding: 12px 8px; font-weight: 600; color: var(--primary-700);">${e.title}</td>
          <td style="padding: 12px 8px;"><span class="badge" style="background: var(--primary-50); color: var(--primary-600);">${e.category}</span></td>
          <td style="padding: 12px 8px; font-weight: 600;">📅 ${e.eventDate ? String(e.eventDate).slice(0, 10) : '未設定'}</td>
          <td style="padding: 12px 8px;">${e.confirmedCount} 人 ${e.waitlistedCount > 0 ? '(候補 ' + e.waitlistedCount + ')' : ''}</td>
          <td style="padding: 12px 8px;"><span class="badge" style="background: ${e.status === '已發佈' ? 'var(--secondary-100)' : 'var(--neutral-200)'}; color: ${e.status === '已發佈' ? 'var(--secondary-700)' : 'var(--neutral-700)'};">${e.status}</span></td>
          <td style="padding: 12px 8px; font-size: 14px; color: var(--neutral-600);">${e.registrationEnd ? String(e.registrationEnd).slice(0, 10) : ''}</td>
          <td style="padding: 12px 8px; text-align: right;">
            <a href="javascript:void(0)" onclick="navTo('admin-event-form', {id: '${e.id}'})" style="margin-right: 8px;">編輯</a>
            <a href="javascript:void(0)" onclick="navTo('admin-regs', {eventId: '${e.id}'})" style="margin-right: 8px;">名單</a>
            <button onclick="handleDuplicate('${e.id}')" style="background:none;border:none;color:var(--primary-500);cursor:pointer;margin-right:8px;">複製</button>
            <button onclick="handleDeleteEvent('${e.id}')" style="background:none;border:none;color:var(--error);cursor:pointer;">🗑️ 刪除</button>
          </td>
        </tr>
      `).join('');
    }

    async function handleDuplicate(eventId) {
      if (!confirm('確定要複製此活動並建立新草稿嗎？')) return;
      showLoading('複製活動中...');
      try {
        const res = await api('duplicateEvent', token, eventId);
        hideLoading();
        if (res.success) {
          showToast('複製成功！', 'success');
          loadAdminEvents();
        } else {
          showToast(res.error || '複製失敗', 'error');
        }
      } catch (e) {
        hideLoading();
        showToast('複製失敗', 'error');
      }
    }

    async function handleDeleteEvent(eventId) {
      if (!confirm('確定要刪除此活動及其相關報名紀錄與場次嗎？此操作無法復原。')) return;
      showLoading('刪除活動中...');
      try {
        const res = await api('deleteEvent', token, eventId);
        hideLoading();
        if (res && res.success) {
          showToast('✅ 已成功刪除活動！', 'success');
          loadAdminEvents();
        } else {
          showToast((res ? res.error : null) || '刪除失敗', 'error');
        }
      } catch (e) {
        hideLoading();
        showToast('刪除失敗: ' + e.toString(), 'error');
      }
    }
  </script>
</body>
</html>
