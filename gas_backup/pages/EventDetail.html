<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>活動詳情 — 慈濟活動報名系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <!-- Markdown 渲染器 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <?!= include('css/Styles') ?>
  <?!= include('js/Api') ?>
</head>
<body>
  <?!= include('partials/Header') ?>

  <main class="narrow-container" style="margin-top: 32px; min-height: 600px;">
    <a href="javascript:void(0)" onclick="navTo('index')" style="display: inline-flex; align-items: center; gap: 4px; margin-bottom: 20px; font-weight: 600;">
      ← 返回活動列表
    </a>

    <div id="event-content" class="card">
      <!-- JavaScript 渲染內容 -->
    </div>
  </main>

  <?!= include('partials/Footer') ?>

  <script>
    const params = JSON.parse('<?= params ?>');
    const eventId = params.id;

    document.addEventListener('DOMContentLoaded', () => {
      if (!eventId) {
        showToast('無效的活動連結', 'error');
        return;
      }
      loadEventDetail();
    });

    async function loadEventDetail() {
      showLoading('載入活動內容...');
      try {
        const detail = await api('getEventDetail', eventId);
        if (!detail) {
          document.getElementById('event-content').innerHTML = '<h3>活動不存在或已下架</h3>';
          return;
        }
        renderEventDetail(detail);
      } catch (e) {
        showToast('載入失敗', 'error');
      } finally {
        hideLoading();
      }
    }

    function renderEventDetail(e) {
      const parsedMarkdown = marked.parse(e.description || '無詳細說明');
      const max = Number(e.maxParticipants) || 0;

      document.getElementById('event-content').innerHTML = `
        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
          <span class="badge" style="background: var(--primary-50); color: var(--primary-600);">${e.category || '活動'}</span>
          <span class="badge" style="background: var(--secondary-50); color: var(--secondary-700);">${e.organizer || '慈濟'}</span>
        </div>

        <h1 style="font-size: 28px; margin-bottom: 20px; line-height: 1.3;">${e.title}</h1>

        <div style="background: var(--neutral-100); padding: 16px; border-radius: var(--radius-md); margin-bottom: 24px; font-size: 15px;">
          <p style="margin-bottom: 8px;"><strong>📍 活動地點：</strong> ${e.location}</p>
          <p style="margin-bottom: 8px;"><strong>📅 報名截止：</strong> ${e.registrationEnd ? e.registrationEnd.slice(0, 10) : '無'}</p>
          <p style="margin-bottom: 8px;"><strong>👤 報名人數：</strong> ${e.confirmedCount} ${max > 0 ? '/ ' + max + ' 人' : '人'}</p>
          ${e.contactName ? `<p><strong>📞 聯絡人員：</strong> ${e.contactName} (${e.contactPhone || ''})</p>` : ''}
        </div>

        ${e.sessions && e.sessions.length > 0 ? `
          <div style="margin-bottom: 24px;">
            <h3 style="font-size: 18px; margin-bottom: 12px;">可用場次</h3>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              ${e.sessions.map(s => `
                <div style="border: 1px solid var(--neutral-200); padding: 12px; border-radius: var(--radius-sm);">
                  <strong>${s.sessionName}</strong>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <div style="line-height: 1.8; margin-bottom: 32px;" class="markdown-body">
          ${parsedMarkdown}
        </div>

        <a href="javascript:void(0)" onclick="navTo('register', {eventId: '${e.id}'})" class="btn btn-primary btn-block" style="font-size: 18px;">
          ${e.isFull ? '正取已滿 ｜ 申請候補報名' : '立即報名參與'}
        </a>
      `;
    }
  </script>
</body>
</html>
