<style>
/* === 慈濟活動報名系統 — 全域 CSS 設計系統 === */

:root {
  /* 慈濟主題品牌色彩 (琉璃藍 + 環保綠 + 蓮花粉 + 暖金) */
  --primary-50:  #EDF5FF;
  --primary-100: #D0E4FF;
  --primary-200: #A3C9F5;
  --primary-300: #6EAAEB;
  --primary-400: #3D8ADB;
  --primary-500: #1A5FAA;  /* 主色：琉璃藍 */
  --primary-600: #134C8A;
  --primary-700: #0D3A6B;
  --primary-800: #08294D;
  --primary-900: #041930;

  --secondary-50:  #ECFDF5;
  --secondary-100: #D1FAE5;
  --secondary-500: #10B981; /* 輔色：環保綠 */
  --secondary-700: #047857;

  --accent-100: #FFE4EB;
  --accent-500: #E8607A; /* 點綴：蓮花粉 */

  --gold-400: #D4A843;
  --gold-500: #B8922F;   /* 莊嚴金 */

  --neutral-50:  #FAFAFA;
  --neutral-100: #F5F5F4;
  --neutral-200: #E7E5E4;
  --neutral-300: #D6D3D1;
  --neutral-400: #A8A29E;
  --neutral-500: #78716C;
  --neutral-600: #57534E;
  --neutral-700: #44403C;
  --neutral-800: #292524;
  --neutral-900: #1C1917;

  --success: #10B981;
  --warning: #F59E0B;
  --error:   #EF4444;
  --info:    #3B82F6;

  --font-primary: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-serif:   'Noto Serif TC', serif;

  --radius-sm:  6px;
  --radius-md:  10px;
  --radius-lg:  16px;
  --radius-xl:  24px;

  --shadow-sm:  0 1px 2px rgba(0,0,0,0.05);
  --shadow-md:  0 4px 6px -1px rgba(0,0,0,0.08);
  --shadow-lg:  0 10px 15px -3px rgba(0,0,0,0.08);
}

/* 基礎設定 */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  overflow-x: hidden;
}

body {
  font-family: var(--font-primary);
  background-color: var(--neutral-50);
  color: var(--neutral-800);
  line-height: 1.6;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, .serif-title {
  font-family: var(--font-serif);
  font-weight: 700;
  color: var(--primary-700);
}

a {
  color: var(--primary-500);
  text-decoration: none;
  transition: color 0.2s;
  white-space: nowrap;
}

a:hover {
  color: var(--primary-700);
}

/* 容器架構 */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 16px;
}

.narrow-container {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 16px;
}

/* 按鈕風格 (符合 48px touch target) */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 24px;
  min-height: 48px;
  font-size: 16px;
  font-weight: 600;
  border-radius: var(--radius-md);
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
  gap: 8px;
  white-space: nowrap;
}

.btn-primary {
  background-color: var(--primary-500);
  color: #ffffff;
  box-shadow: 0 2px 4px rgba(26, 95, 170, 0.25);
}

.btn-primary:hover {
  background-color: var(--primary-600);
  transform: translateY(-1px);
}

.btn-secondary {
  background-color: var(--secondary-500);
  color: #ffffff;
}

.btn-secondary:hover {
  background-color: var(--secondary-700);
}

.btn-outline {
  background-color: transparent;
  border: 1.5px solid var(--primary-500);
  color: var(--primary-500);
}

.btn-outline:hover {
  background-color: var(--primary-50);
}

.btn-block {
  width: 100%;
}

.btn:active {
  transform: scale(0.97);
}

/* 表單與輸入框 */
.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--neutral-700);
}

.form-label .required {
  color: var(--error);
  margin-left: 4px;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 12px 16px;
  min-height: 48px;
  font-size: 16px;
  border: 1.5px solid var(--neutral-300);
  border-radius: var(--radius-md);
  background-color: #ffffff;
  transition: border-color 0.2s;
  font-family: inherit;
}

.form-textarea {
  min-height: 120px;
  resize: vertical;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--primary-500);
  box-shadow: 0 0 0 3px rgba(26, 95, 170, 0.15);
}

/* 卡片設計 */
.card {
  background: #ffffff;
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow-md);
  border: 1px solid var(--neutral-200);
  transition: transform 0.2s, box-shadow 0.2s;
}

.card-hover:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}

/* 狀態標籤 (Badge) */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 12px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  gap: 4px;
  white-space: nowrap;
}

.badge-confirmed { background-color: #D1FAE5; color: #065F46; }
.badge-waitlisted { background-color: #FEF3C7; color: #92400E; }
.badge-cancelled  { background-color: #FEE2E2; color: #991B1B; }
.badge-attended   { background-color: #DBEAFE; color: #1E40AF; }

/* 網格系統 */
.grid {
  display: grid;
  gap: 24px;
}

.grid-cols-1 { grid-template-columns: repeat(1, 1fr); }

@media (min-width: 640px) {
  .grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
}

@media (min-width: 1024px) {
  .grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-cols-4 { grid-template-columns: repeat(4, 1fr); }
}

/* 頁首 Header */
.site-header {
  background: #ffffff;
  border-bottom: 1px solid var(--neutral-200);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.header-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 64px;
}

.brand-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 20px;
  font-weight: 700;
  color: var(--primary-600);
  white-space: nowrap;
}

.nav-links {
  display: flex;
  gap: 20px;
  align-items: center;
  white-space: nowrap;
}

/* 表格橫向捲動容器 */
.table-responsive {
  display: block;
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/* === 手機 / 平板 RWD 響應式優化 (Screen < 768px) === */
@media (max-width: 767px) {
  .header-inner {
    flex-direction: column;
    height: auto;
    padding: 12px 16px;
    gap: 10px;
  }

  .brand-logo {
    font-size: 18px;
  }

  .nav-links {
    width: 100%;
    justify-content: center;
    gap: 16px;
    font-size: 15px;
    border-top: 1px solid var(--neutral-100);
    padding-top: 8px;
  }

  /* 後台管理主要容器在手機改為單欄上下排列 */
  .admin-container {
    flex-direction: column !important;
  }

  .admin-sidebar {
    width: 100% !important;
    min-height: auto !important;
    border-right: none !important;
    border-bottom: 1px solid var(--neutral-200);
    padding: 12px 16px !important;
  }

  .admin-sidebar-title {
    display: none;
  }

  .admin-sidebar nav {
    flex-direction: row !important;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 6px;
    gap: 6px !important;
  }

  .admin-nav-item {
    white-space: nowrap;
    padding: 8px 14px !important;
    font-size: 14px !important;
    background: var(--neutral-100);
    border-radius: 20px !important;
  }

  .admin-main {
    padding: 16px !important;
  }

  .card {
    padding: 16px;
  }

  .grid-cols-4 {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 12px !important;
  }
}

/* 頁尾 Footer */
.site-footer {
  background: var(--neutral-900);
  color: var(--neutral-400);
  padding: 40px 0;
  margin-top: 60px;
  text-align: center;
  font-size: 14px;
}

.site-footer a {
  color: var(--neutral-300);
}
</style>
